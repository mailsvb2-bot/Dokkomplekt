name: Apply render optimization once

on:
  push:
    branches: [fix/audit-hardening-1491]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-hardening-1491
          fetch-depth: 0
      - name: Apply bounded parallel DOCX render optimization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('universal_generation.py')
          s = p.read_text(encoding='utf-8')
          if 'from concurrent.futures import ThreadPoolExecutor' not in s:
              s = s.replace(
                  'from dataclasses import asdict, dataclass\n',
                  'from concurrent.futures import ThreadPoolExecutor\nfrom dataclasses import asdict, dataclass\n',
                  1,
              )
          start = s.index('def render_documents_from_pack(')
          end = s.index('\n\ndef save_readiness_report', start)
          new = '''def render_documents_from_pack(
              *,
              pack: DocumentPack,
              case: PatientCase,
              document_ids: Sequence[str],
              output_dir: str | Path,
              base_dir: str | Path | None = None,
              strict: bool = True,
              output_language: str = "auto",
              spellcheck_enabled: bool = True,
              output_format: str = "docx",
          ) -> PackGenerationResult:
              """Render selected custom documents from a DocumentPack as Word or PDF.

              Output names and validation are planned deterministically first. Independent
              DOCX renders then use a small bounded thread pool: python-docx spends most of
              its batch time parsing XML and compressing ZIP members, which can overlap on
              Windows without sharing mutable Document objects. PDF export remains serial
              because Word/COM automation is not thread-safe.
              """

              output_root = Path(output_dir).expanduser()
              if output_root.exists() and not output_root.is_dir():
                  raise ValueError(f"Папка результата указывает на файл, а не на папку: {output_root}")
              output_root.mkdir(parents=True, exist_ok=True)
              selected = {str(item).strip() for item in document_ids if str(item).strip()}
              known_ids = {document.id for document in pack.documents}
              created: list[str] = []
              renders: list[RenderResult] = []
              skipped: list[str] = []
              warnings: list[str] = []
              reserved_output_names: dict[str, int] = {}
              reserved_output_paths: set[str] = set()
              requested_format = normalize_output_format(output_format)
              for unknown_id in sorted(selected - known_ids):
                  skipped.append(f"Неизвестный документ профиля: {unknown_id}")

              plans: list[tuple[DocumentTemplateSpec, Path, Path]] = []
              for document in pack.documents:
                  if selected and document.id not in selected:
                      continue
                  template_path = _resolve_template_path(document, base_dir)
                  if not template_path.exists():
                      skipped.append(f"{document.button_label}: шаблон не найден ({document.template})")
                      continue
                  missing = missing_required_fields(case, document)
                  if strict and missing:
                      skipped.append(f"{document.button_label}: не заполнены поля {', '.join(missing)}")
                      continue
                  rendered_name = render_output_name(document, case, output_language=output_language, spellcheck_enabled=spellcheck_enabled)
                  docx_path = _available_batch_path(output_root / rendered_name, reserved_output_names, reserved_output_paths)
                  plans.append((document, template_path, docx_path))

              def render_one(plan: tuple[DocumentTemplateSpec, Path, Path]) -> RenderResult:
                  document, template_path, docx_path = plan
                  return render_template_to_docx(
                      template_path=template_path,
                      output_path=docx_path,
                      case=case,
                      document=document,
                      strict=strict,
                      output_language=output_language,
                      spellcheck_enabled=spellcheck_enabled,
                  )

              if len(plans) >= 4:
                  # Keep the pool deliberately small. Profiling shows five workers gives
                  # useful Windows ZIP/XML overlap without turning batch creation into an
                  # unbounded CPU/disk fan-out. Futures are consumed in document order.
                  with ThreadPoolExecutor(max_workers=min(5, len(plans)), thread_name_prefix="dokkomplekt-render") as executor:
                      futures = [executor.submit(render_one, plan) for plan in plans]
                      render_pairs = [(plan, future.result()) for plan, future in zip(plans, futures, strict=True)]
              else:
                  render_pairs = [(plan, render_one(plan)) for plan in plans]

              for plan, result in render_pairs:
                  document, _template_path, _docx_path = plan
                  renders.append(result)
                  final_path = Path(result.output_path)
                  if requested_format == "pdf":
                      try:
                          final_path = export_docx_to_pdf(final_path)
                      except Exception as exc:
                          warnings.append(f"{document.button_label}: PDF export failed, Word file kept: {exc}")
                  created.append(str(final_path))
                  if result.missing_fields:
                      warnings.append(f"{document.button_label}: placeholders без значения: {', '.join(result.missing_fields)}")
              return PackGenerationResult(tuple(created), tuple(renders), tuple(skipped), tuple(dict.fromkeys(warnings)))
          '''
          # Dedent the embedded function from the workflow's Python source indentation.
          import textwrap
          s = s[:start] + textwrap.dedent(new) + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile universal_generation.py
          rm -f _tmp_parallel_render_marker.txt .github/workflows/_apply_render_optimization.yml
      - name: Commit patch and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Optimize bounded batch DOCX rendering"
          git push origin HEAD:fix/audit-hardening-1491
