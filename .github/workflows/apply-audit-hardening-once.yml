name: Apply audit hardening once

on:
  push:
    branches: [fix/audit-hardening-1491]
    paths:
      - .github/workflows/apply-audit-hardening-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/audit-hardening-1491'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/audit-hardening-1491
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_dev.txt
      - name: Reassemble, verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/audit_hardening_remaining.part{1,2,3,4,5}.b64 > /tmp/audit.patch.gz.b64
          base64 -d /tmp/audit.patch.gz.b64 > /tmp/audit.patch.gz
          echo 'ee68e04fa08a41a7c2495efc63707c99ab47fe59fe7810431a89d886c6bb228c  /tmp/audit.patch.gz' | sha256sum -c -
          gzip -dc /tmp/audit.patch.gz > /tmp/audit.patch
          echo '193e49ba230aafce41f49598eb8145a197854146f7fa17f762dd97a6b597c2f6  /tmp/audit.patch' | sha256sum -c -
          git apply --check /tmp/audit.patch
          git apply /tmp/audit.patch
          python -m compileall -q .
          python -m pytest -q \
            tests/test_audit_hardening_v1491x.py \
            tests/test_product_licensing_contract.py \
            tests/test_native_license_security_v1499.py \
            tests/test_build_check_wiring_v1495.py
      - name: Commit final source changes
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            tools/audit_hardening_remaining.patch.gz.b64 \
            tools/audit_hardening_remaining.part1.b64 \
            tools/audit_hardening_remaining.part2.b64 \
            tools/audit_hardening_remaining.part3.b64 \
            tools/audit_hardening_remaining.part4.b64 \
            tools/audit_hardening_remaining.part5.b64 \
            .github/workflows/apply-audit-hardening-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish v1.4.91 audit hardening"
          git push origin HEAD:fix/audit-hardening-1491
