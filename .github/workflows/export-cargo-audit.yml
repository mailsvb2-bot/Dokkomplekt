name: Export cargo-audit and advisory DB

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/export-cargo-audit.yml'
      - 'ci_payload/cargo_audit_trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - name: Install auditor and clone official advisory database
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo install cargo-audit --locked
          mkdir -p payload evidence
          git clone --depth 1 https://github.com/RustSec/advisory-db.git payload/advisory-db
          cp "$(command -v cargo-audit)" payload/cargo-audit
          chmod +x payload/cargo-audit
          payload/cargo-audit --version > evidence/cargo-audit-version.log
          git -C payload/advisory-db rev-parse HEAD > evidence/advisory-db-commit.txt
          find payload/advisory-db -type f -print0 | sort -z | xargs -0 sha256sum > evidence/advisory-db-files.sha256
          sha256sum payload/cargo-audit > evidence/cargo-audit.sha256
      - name: Upload audit tooling
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-rustsec-db
          path: |
            payload
            evidence
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
