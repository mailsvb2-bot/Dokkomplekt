name: Commercial License Hardening Maintenance

on:
  push:
    branches:
      - fix/complete-commercial-license-backlog
    paths:
      - "rust/**"
      - "product_access/**"
      - "tests/test_native_license_security_v1499.py"
      - "tests/test_product_licensing_contract.py"
      - ".github/license-hardening.patch.gz.b64"
      - ".github/workflows/rustfmt-maintenance.yml"

permissions:
  contents: write

concurrency:
  group: commercial-hardening-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-format-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/complete-commercial-license-backlog
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore pre-format Rust base and apply exact hardening patch
        shell: bash
        run: |
          set -euo pipefail
          git checkout 68c752c8db53c44b5d048df8529b7eb483c1457e -- rust
          python - <<'PY'
          import base64, gzip, pathlib
          encoded = pathlib.Path('.github/license-hardening.patch.gz.b64').read_text('utf-8').strip()
          pathlib.Path('/tmp/license-hardening.patch').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          git apply --check /tmp/license-hardening.patch
          git apply /tmp/license-hardening.patch

      - name: Install focused test dependencies
        run: python -m pip install -r requirements.txt -r requirements_dev.txt

      - name: Run focused product-access regressions
        run: >-
          python -m pytest -q
          tests/test_product_licensing_contract.py
          tests/test_native_license_security_v1499.py
          tests/test_transaction_concurrency_v1516.py

      - name: Set up Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format final Rust workspace
        working-directory: rust
        run: cargo fmt --all

      - name: Commit hardened canonical sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product_access rust tests/test_native_license_security_v1499.py tests/test_product_licensing_contract.py
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Harden native licensing revocation and offline usage integrity"
          git push origin HEAD:fix/complete-commercial-license-backlog
