name: v14100 materialize

on:
  push:
    branches:
      - transport/v14100-materialize

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d839559786b7968b19bfe5e4fdd205fb969507ad
          fetch-depth: 0
      - name: Fetch exact patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://paste.rs/XfVIZ -o /tmp/v14100.patch
          echo 'c9cb4caa37f4e43a343397daab3f83054681d5e5a041b44afb672bb24d1a8a3a  /tmp/v14100.patch' | sha256sum -c -
      - name: Apply and verify exact tree
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/v14100.patch
          tree=$(git write-tree)
          echo "candidate tree=$tree"
          test "$tree" = '55976ec7b29076e65162a6ea28bb92c702082515'
      - name: Commit and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Release 1.4.100 template residue guard hotfix'
          test "$(git rev-parse HEAD^{tree})" = '55976ec7b29076e65162a6ea28bb92c702082515'
          git push --force origin HEAD:refs/heads/release/v1.4.100-template-residue-guard
