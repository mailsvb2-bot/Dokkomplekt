name: v14100 materialize

on:
  push:
    branches:
      - transport/v14100-materialize

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f750b11a7631e9082d8440ae6eda4ca79aa7b410
          fetch-depth: 0
      - name: Fetch exact P1 review follow-up patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://paste.rs/Jjh32 -o /tmp/v14100-p1-followup.patch
          echo '52eefeeeacf76e958afeb5c0792ba8120cb1c5241eaec14d7b75529c84184cae  /tmp/v14100-p1-followup.patch' | sha256sum -c -
      - name: Apply and verify exact tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'f750b11a7631e9082d8440ae6eda4ca79aa7b410'
          git apply --index /tmp/v14100-p1-followup.patch
          tree=$(git write-tree)
          echo "candidate tree=$tree"
          test "$tree" = '07619bbe8de5d2c0c19a8a240044fe6544d154af'
      - name: Commit and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Resolve template residue guard P1 review findings'
          test "$(git rev-parse HEAD^{tree})" = '07619bbe8de5d2c0c19a8a240044fe6544d154af'
          git push --force origin HEAD:refs/heads/release/v1.4.100-template-residue-guard
